[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-tools-kit"
version = "0.6.4"
description = "Installer protocol + helpers for self-installing Python CLI/GUI tools (desktop shortcuts, bash aliases, cron entries), plus reusable tkinter and curses installer screens"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Steffen Probst" },
]
keywords = ["installer", "desktop", "cron", "cli", "linux", "kde", "gnome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "termcolor>=2.0",
    # cli_tools_kit.sources reads installer.toml; tomllib is 3.11+.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# The reusable tkinter GUI installer engine (cli_tools_kit.gui_installer) needs
# Pillow for tool-icon rendering. tkinter itself ships with CPython. The engine
# degrades gracefully (icons disabled) when Pillow is absent, so this stays optional.
gui = [
    "Pillow>=9.0",
]

[project.scripts]
cli-tool-installer = "cli_tools_kit.gui_installer:run"
# First-run setup for an organisation adopting the kit. Same thing as
# `python3 -m cli_tools_kit`.
cli-tools-kit-setup = "cli_tools_kit.onboarding:main"

[project.urls]
Homepage = "https://github.com/Probst1nator/cli-tools-kit"
Issues = "https://github.com/Probst1nator/cli-tools-kit/issues"

[tool.setuptools.packages.find]
include = ["cli_tools_kit*"]
exclude = ["tests*", "examples*"]
